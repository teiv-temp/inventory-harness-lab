name: 검증

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 검증 실행
        env:
          SESSION_SECRET: ci-verification-secret-change-me
          PROTECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PROTECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PROTECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npm run verify
